{% extends 'django_spire/component/scroll/item/item.html' %}

{% block scroll_item_class %}row border-bottom py-2{% endblock %}

{% block scroll_item_content %}
    <div class="col-4">
        <a href="{% url 'history:detail' pk=item.pk %}" data-history-name>{{ item.name }}</a>
    </div>
    <div class="col-8 text-muted">{{ item.description }}</div>
{% endblock %}
