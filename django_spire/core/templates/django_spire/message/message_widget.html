{% load django_spire_message %}

{# To dispatch notification in other x-data use  $dispatch('notify', { message, type }) #}
<div
    class="fixed-top"
    style="pointer-events: none; z-index: 9999;"
    @notify.window="add($event)"
    x-data="messageNotifications({% django_messages_to_json messages %})"
>
    <template x-for="notification in notifications" :key="notification.id">
        {% include 'django_spire/message/message_item.html' %}
    </template>
</div>
