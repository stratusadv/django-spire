<div
        x-data="glueScroll(Glue.querySet.{% block scroll_queryset_unique_name %}{% endblock %}, '{% block scroll_queryset_order_by_field %}{% endblock %}', '{% block scroll_queryset_filter_field %}{% endblock %}')"
        class="{% block scroll_container_class %}{% endblock %}"
>

    <div class="row">
        <div class="col">
            {% block scroll_header %}
            {% endblock %}
        </div>
    </div>

    <div class="row">
        <div class="col">

            {% block scroll_content %}
                <template x-if="items.length > 0">
                    <template x-for="(item, itemIndex) in items">
                        {% block scroll_template_item %}
                        {% endblock %}
                    </template>
                </template>
                <div x-show="items.length === 0">
                    {% include 'django_spire/item/no_data_item.html' %}
                </div>

            {% endblock %}

            <div
                    x-ref="scroll_sentinel"
                    style="height: 1200px; margin-top: -1200px; pointer-events: none;"
            >
            </div>
        </div>
    </div>

    <div x-show="hasMore" x-cloak class="row">
        <div
            class="col p-3 text-end"
            aria-live="polite"
        >
                <span class="spinner-border spinner-border-sm" role="status">
                    <span class="visually-hidden">Loading items...</span>
                </span>Loading items...
        </div>
    </div>

    <div class="row">
        <div class="col">
            {% block scroll_footer %}
            {% endblock %}
        </div>
    </div>


</div>
