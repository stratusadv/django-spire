{% load django_spire_glue %}
{% firstof glue_form_object_name component.glue_form_object_name 'glue_form' as glue_form_object_name %}
<div x-data="{
    {% block glue_form_binding %}{{ glue_form_object_name }}: {% block glue_form %}Glue.form.{% block glue_form_unique_name %}{% endblock %}{% endblock %},{% endblock %}
    is_processing: false,
    async submit_form() {
        this.is_processing = true
        try {
            const form = this.{{ glue_form_object_name }}
            const action = typeof form.submit === 'function' ? 'submit' : 'save_model_obj'
            let result = await form[action]({% block glue_form_save_kwargs %}{}{% endblock %})
            {# TODO: Dispatch onsaved and onerror events with the Glue form in event.detail for ergonomic JavaScript hooks. #}
            {% block glue_form_on_saved %}
            if(result?.redirect) {
                window.location.href=result.redirect.url
            }
            {% endblock %}
        } finally {
            this.is_processing = false
        }
    }
}">

    {% glue_form_path glue_form_object_name %}
    {% block glue_form_content %}
    {% endblock %}

    <div class="row">
        <div class="col-12 mt-3">
            {% include 'django_spire/glue/form/button/submit_button.html' %}
        </div>
    </div>

</div>
