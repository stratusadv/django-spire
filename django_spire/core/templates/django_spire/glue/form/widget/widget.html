{% load django_glue %}
<div
    x-data="glueField({{ glue_field|glue_field_metadata_path }}, () => {{ glue_field|glue_field_value_path }}, (newValue) => {{ glue_field|glue_field_value_path }} = newValue)"
    @input="dispatchFieldEvent('field-input')"
    @change="dispatchFieldEvent('field-change')"
    @focusin="if (!$el.contains($event.relatedTarget)) dispatchFieldEvent('field-focus')"
    @focusout="if (!$el.contains($event.relatedTarget)) dispatchFieldEvent('field-blur')"
>
    {% if not hide_label %}
        {% block widget_label %}
            <label :for="field.id" class="form-label">
                <span x-text="field.label"></span><span x-show="field.required" class="text-danger" aria-hidden="true"> *</span>
            </label>
        {% endblock %}
    {% endif %}

    {% block widget_content %}
    {% endblock %}
    <div class="invalid-feedback" x-show="field.hasErrors" x-text="field.errorText"></div>
    <small class="text-muted d-block" x-show="field.help_text" x-text="field.help_text"></small>
</div>
