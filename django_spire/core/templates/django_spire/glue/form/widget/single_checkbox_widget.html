{% extends 'django_spire/glue/form/widget/widget.html' %}
{% load django_glue %}

{% block widget_label %}{% endblock %}

{% block widget_content %}
    <div class="d-flex align-items-center">
        <input
            type="checkbox"
            class="form-check-input me-2"
            :id="fieldId"
            :name="field.name"
            x-model="value"
        >
        <label
            class="form-check-label{% if hide_label %} visually-hidden{% endif %}"
            :for="fieldId"
        >
            <span x-text="{{ x_label|default:'field.label' }}"></span><span x-show="field.required" class="text-danger" aria-hidden="true"> *</span>
        </label>
    </div>
{% endblock %}
