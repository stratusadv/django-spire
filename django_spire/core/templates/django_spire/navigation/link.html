<a
    class="side-navigation-link {{ link_class }} {% if link_url and request.path == link_url %}active{% endif %}"
    href="{{ link_url }}"
    {% if not disable_overlay %}x-bind="sideNavigationLink"{% endif %}
>
    <i class="{{ link_icon }} flex-shrink-0" style="width: 1.25rem;"></i>
    <span class="text-truncate side-nav-expanded-only">{{ link_text }}</span>
</a>
