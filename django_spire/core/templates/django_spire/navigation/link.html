<a
    class="d-flex align-items-center gap-2 rounded-3 px-3 py-1 fw-medium cursor-pointer text-link-side-navigation ds-fs-9 {{ link_class }} {% if link_url and request.path == link_url %}active{% endif %}"
    href="{{ link_url }}"
    {% if not disable_overlay %}
    x-data="navLink('{{ request.path|escapejs }}', '{{ link_url|escapejs }}')"
    @nav-redirect.window="current_path = $event.detail.path"
    :class="{ 'active': is_active() }"
    @click.prevent="redirect()"
    {% endif %}
>
    <i class="{{ link_icon }} flex-shrink-0" style="width: 1.25rem;"></i>
    <span class="text-truncate side-nav-expanded-only">{{ link_text }}</span>
</a>
