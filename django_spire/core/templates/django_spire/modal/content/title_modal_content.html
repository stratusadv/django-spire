{% extends 'django_spire/modal/content/modal_content.html' %}

{% block modal_content %}
    <div class="modal-header">
        <div class="modal-title" id="{{ modal_camel_case_id }}Label">
            {% block modal_title %}
            {% endblock %}
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    {% block modal_title_content %}
        <div class="modal-body">
            {% block modal_title_body %}
                {% block modal_body %}
                {% endblock %}
            {% endblock %}
        </div>
    {% endblock %}
{% endblock %}
