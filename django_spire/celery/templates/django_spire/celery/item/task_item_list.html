{% if celery_tasks %}
    {% for celery_task in celery_tasks %}
        <div
            x-data="{
            reload_task() {
                let task_item_view = Glue.view(`{% url 'django_spire:celery:task:item' celery_task.task_id %}`)
                task_item_view.renderInnerHtml($el, {}).catch(() => {})
            },
            init() {
                const jittered_poll_interval = Math.floor(Math.random() * 1000) + 2000
                const poll = setInterval(() => {
                    if (!$el.isConnected) {
                        clearInterval(poll)
                        return
                    }
                    const content = $el.querySelector('[data-processing]')
                    if (!content) return
                    if (content.dataset.processing !== 'true') {
                        clearInterval(poll)
                        return
                    }
                    this.reload_task()
                }, jittered_poll_interval)
            },
        }"
            class="mb-3 bg-body-tertiary shadow-sm border border-1 rounded-3"
        >
            {% include 'django_spire/celery/item/task_item.html' %}
        </div>
    {% endfor %}
{% endif %}
