{% if celery_tasks %}
    {% for celery_task in celery_tasks %}
        <div
            key="{{ celery_task.task_id }}"
            x-data="{
            reload_task() {
                let task_toast_view = Glue.view(`{% url 'django_spire:celery:task:toast' celery_task.task_id %}`)
                return task_toast_view.renderInnerHtml($el, {})
            },
        }"
            class="toast show mb-2 shadow"
            role="alert"
            aria-live="assertive"
            aria-atomic="true"
        >
            {% include 'django_spire/celery/toast/task_toast.html' %}
        </div>
    {% endfor %}
{% endif %}
