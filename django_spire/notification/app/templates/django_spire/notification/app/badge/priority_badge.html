<span
    x-data="{ priority: item.notification.priority }"
    class="badge text-white"
    :class="{
        'bg-secondary': priority === 'low',
        'bg-warning': priority === 'medium',
        'bg-danger': priority === 'high'
    }"
    x-text="({low: 'Low', medium: 'Medium', high: 'High'})[priority]"
></span>
