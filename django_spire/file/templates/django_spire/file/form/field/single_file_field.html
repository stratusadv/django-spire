{% extends 'django_spire/glue/form/widget/widget.html' %}

{% block widget_content %}
    <div x-data="glueSingleFileField()">
        <div class="mb-2" x-show="preview || value?.url || current_file?.preview">
            <img :src="preview || value?.url || current_file?.preview" alt="" class="img-fluid rounded" style="max-height: {{ max_preview_height|default:'200px' }};">
        </div>
        <div class="d-flex align-items-center gap-2">
            <input
                type="file"
                {% include 'django_spire/glue/form/widget/attributes/input_attributes.html' with exclude_x_model=True %}
                {% if accept %}accept="{{ accept }}"{% endif %}
                @change="handle_file_change($event)"
            >
            <button
                type="button"
                class="btn btn-outline-secondary"
                @click="clear_file()"
                x-show="value || preview"
            >
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    </div>
{% endblock %}
