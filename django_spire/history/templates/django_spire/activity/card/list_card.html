<div class="card">
    <div class="card-body pt-2" style="max-height: 400px; overflow-y: auto; overflow-x: hidden;">
        <span class="fs-5">Recent Activity</span>
        {% if activity_log %}
            {% for activity in activity_log %}
                {% include 'django_spire/activity/item/activity_item.html' %}
            {% endfor %}
        {% else %}
            {% include 'django_spire/item/no_data_item.html' %}
        {% endif %}
    </div>
</div>
