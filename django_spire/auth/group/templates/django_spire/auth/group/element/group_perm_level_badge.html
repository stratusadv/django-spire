<span 
    x-data="{
        permissionLevelClassMap: {
            'view': 'bg-primary',
            'add': 'bg-primary',
            'change': 'bg-success',
            'delete': 'bg-danger',
        }
    }"
    :class="`badge bg-secondary text-white ${permissionLevelClassMap[{{ x_permission_level|lower }}]}`"
    x-text="{{ x_permission_level }}"
></span>
