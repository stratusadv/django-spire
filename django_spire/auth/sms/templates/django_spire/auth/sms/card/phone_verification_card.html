{% load django_spire_core %}

{% with enrollment_start_url='django_spire:auth:sms:enrollment:start' enrollment_confirm_url='django_spire:auth:sms:enrollment:confirm' session_code_url='django_spire:auth:sms:session_code' %}

<div
    class="card"
    x-data="{
        is_verified: {{ sms_auth.is_verified|yesno:'true,false' }},
        current_phone_number: '{{ sms_auth.phone_number }}',
        phone_number: '',
        code: '',
        session_code: '',
        session_expiry_minutes: 0,
        step: 'pending',
        loading: false,
        error_message: '',

        masked_phone_number() {
            let digits = this.current_phone_number.replace(/\D/g, '');
            if (digits.length < 4) {
                return this.current_phone_number;
            }

            return '*' + digits.slice(-4);
        },

        switch_to(step) {
            this.step = step;
            this.error_message = '';
        },

        async resend_code() {
            this.phone_number = this.current_phone_number;
            await this.send_code();
        },

        async send_code() {
            this.loading = true;
            this.error_message = '';

            let response = await Spire.ajax.request(
                'POST',
                '{% url enrollment_start_url %}',
                {phone_number: this.phone_number}
            );

            if (Spire.notify.tryResponseError(response.data, 'Unable to send the verification code.')) {
                this.loading = false;
                return;
            }

            this.current_phone_number = this.phone_number;
            this.phone_number = '';
            this.loading = false;
            this.switch_to('code');
            Spire.notify.success(response.data.message);
        },

        async confirm_code() {
            this.loading = true;
            this.error_message = '';

            let response = await Spire.ajax.request(
                'POST',
                '{% url enrollment_confirm_url %}',
                {phone_number: this.current_phone_number, code: this.code}
            );

            if (Spire.notify.tryResponseError(response.data, 'Unable to verify your code.')) {
                this.loading = false;
                return;
            }

            this.code = '';
            this.is_verified = true;
            this.loading = false;
            this.switch_to('verified');
            Spire.notify.success(response.data.message);
        },

        async generate_session_code() {
            this.loading = true;
            this.error_message = '';

            let response = await Spire.ajax.request(
                'POST',
                '{% url session_code_url %}',
                {phone_number: this.current_phone_number}
            );

            if (Spire.notify.tryResponseError(response.data, 'Unable to generate a session code.')) {
                this.loading = false;
                return;
            }

            this.session_code = response.data.code;
            this.session_expiry_minutes = response.data.expiry_minutes;
            this.loading = false;
        }
    }"
>
    <div class="card-header">
        <div class="row">
            <div class="col card-title">
                <i class="bi bi-phone-fill"></i>
                Phone Number
            </div>
            <div class="col-auto">
                <template x-if="is_verified">
                    <span class="badge text-bg-success">Verified</span>
                </template>
                <template x-if="!is_verified">
                    <span class="badge text-bg-secondary">Not Verified</span>
                </template>
            </div>
        </div>
    </div>

    <div class="card-body">
        <template x-if="error_message">
            <div class="alert alert-danger py-2" x-text="error_message"></div>
        </template>

        <template x-if="!is_verified && step === 'pending'">
            <div class="row g-2">
                <div class="col-12">
                    <label class="form-label">Phone Number</label>
                    <input
                        class="form-control"
                        type="tel"
                        x-model="phone_number"
                        placeholder="e.g. 555-123-4567"
                    />
                </div>
                <div class="col-12">
                    <button class="btn btn-primary" type="button" @click="send_code" :disabled="loading">
                        <i class="bi bi-send-fill"></i>
                        Send Verification Code
                    </button>
                </div>
            </div>
        </template>

        <template x-if="!is_verified && step === 'code'">
            <div class="row g-2">
                <div class="col-12">
                    <div class="d-flex align-items-center gap-2">
                        <span class="fw-semibold" x-text="masked_phone_number()"></span>
                        <button class="btn btn-link btn-sm p-0" type="button" @click="switch_to('pending')">
                            Change
                        </button>
                    </div>
                    <div class="text-muted small">
                        Enter the 6-digit code we texted you. It expires after
                        {{ code_expiry_minutes }} minutes.
                    </div>
                </div>
                <div class="col-12">
                    <label class="form-label">Verification Code</label>
                    <input
                        class="form-control text-center"
                        type="text"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        maxlength="6"
                        x-model="code"
                        placeholder="000000"
                    />
                </div>
                <div class="col-12">
                    <button class="btn btn-primary" type="button" @click="confirm_code" :disabled="loading">
                        <i class="bi bi-check2-circle"></i>
                        Verify Phone Number
                    </button>
                    <a class="btn btn-link" @click.prevent="resend_code">
                        Resend Code
                    </a>
                </div>
            </div>
        </template>

        <template x-if="is_verified">
            <div class="row g-2">
                <div class="col-12">
                    <div class="d-flex align-items-center gap-2">
                        <span class="fw-semibold" x-text="masked_phone_number()"></span>
                        <span class="badge text-bg-success">Verified</span>
                    </div>
                    <div class="text-muted small">
                        This phone number can be used to unlock an SMS AI session.
                    </div>
                </div>
                <div class="col-12">
                    <button class="btn btn-primary" type="button" @click="generate_session_code" :disabled="loading">
                        <i class="bi bi-unlock-fill"></i>
                        Generate Session Code
                    </button>
                </div>

                <template x-if="session_code">
                    <div class="col-12">
                        <div class="alert alert-info">
                            <div class="fw-semibold">Your session code:</div>
                            <div class="display-6 text-center fw-bold" x-text="session_code"></div>
                            <div class="small text-muted">
                                Text this code to your SMS number. It expires in
                                <span x-text="session_expiry_minutes"></span> minutes.
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </template>
    </div>
</div>

{% endwith %}
