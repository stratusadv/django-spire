<div
    class="modal-body"
    x-data="{
        phone_number: '',
        code: '',
        clicked: false,
        step: 'pending',
        loading: false,
        error_message: '',

        masked_phone_number() {
            let digits = this.current_phone_number.replace(/\D/g, '');
            if (digits.length < 4) {
                return this.current_phone_number;
            }

            return '*' + digits.slice(-4);
        },

        switch_to(step) {
            this.step = step;
            this.error_message = '';
        },

        async resend_code() {
            this.phone_number = this.current_phone_number;
            await this.send_code();
        },

        async send_code() {
            this.loading = true;
            this.error_message = '';

            let response = await Spire.ajax.request(
                'POST',
                '{% url "django_spire:auth:sms:json:verification_start" %}',
                {phone_number: this.phone_number}
            );

            if (Spire.notify.tryResponseError(response.data, 'Unable to send the verification code.')) {
                this.loading = false;
                return;
            }

            this.current_phone_number = this.phone_number;
            this.phone_number = '';
            this.loading = false;
            this.switch_to('code');
            Spire.notify.success(response.data.message);
        },

        async confirm_code() {
            this.loading = true;
            this.error_message = '';

            let response = await Spire.ajax.request(
                'POST',
                '{% url "django_spire:auth:sms:json:verification_confirm" %}',
                {phone_number: this.current_phone_number, code: this.code}
            );

            if (Spire.notify.tryResponseError(response.data, 'Unable to verify your code.')) {
                this.loading = false;
                return;
            }

            this.code = '';
            this.loading = false;
            this.is_verified = true;
            Spire.notify.success(response.data.message);
        }
    }"
>
    <template x-if="error_message">
        <div class="alert alert-danger py-2" x-text="error_message"></div>
    </template>

    <template x-if="step === 'pending'">
        <div class="row g-2">
            <div class="col-12 p-0 mt-0">
                <div class="alert alert-info small text-muted mb-0">
                    Only trust a reply that comes from <strong>{{ sender_phone_number|default:'our number' }}</strong>. We'll never message you from any other number.
                </div>
            </div>
            <div class="col-12">
                <label class="form-label">Phone Number</label>
                <input
                    class="form-control"
                    type="tel"
                    x-model="phone_number"
                    placeholder="e.g. 555-123-4567"
                     @keydown.enter.prevent="send_code"
                />
            </div>
            <div class="col-12">
                <button class="btn btn-primary" type="button" @click="send_code" :disabled="loading">
                    <i class="bi bi-send-fill"></i>
                    Send Verification Code
                </button>
            </div>
        </div>
    </template>

    <template x-if="step === 'code'">
        <div class="row g-2">
            <div class="col-12">
                <div class="d-flex align-items-center gap-2">
                    <span class="fw-semibold" x-text="masked_phone_number()"></span>
                    <button class="btn btn-link btn-sm p-0" type="button" @click="switch_to('pending')">
                        Change
                    </button>
                </div>
                <div class="text-muted small">
                    Enter the 6-digit code we texted you from
                    <strong>{{ sender_phone_number|default:'our number' }}</strong>.
                    It expires after {{ code_expiry_minutes }} minutes.
                </div>
            </div>
            <div class="col-12">
                <label class="form-label">Verification Code</label>
                <input
                    class="form-control text-center"
                    type="text"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    maxlength="6"
                    x-model="code"
                    x-init="$el.focus(); $el.select()"
                    placeholder="000000"
                    @keydown.enter.prevent="confirm_code"
                />
            </div>
            <div class="col-12">
                <button class="btn btn-primary" type="button" @click="confirm_code" :disabled="loading">
                    <i class="bi bi-check2-circle"></i>
                    Verify Phone Number
                </button>
                <a class="btn btn-link" @click.prevent="resend_code">
                    Resend Code
                </a>
            </div>
        </div>
    </template>
</div>
