{% extends 'django_spire/page/full_page.html' %}

{% block full_page_content %}
    <div class="card">
        <div class="card-body">
            {% if domain.is_orphaned %}
                <div class="mb-3">
                    {% include 'django_spire/metric/domain/orphan_badge.html' with is_orphaned=domain.is_orphaned %}
                </div>
            {% endif %}
            {% include 'django_spire/metric/domain/form/form.html' %}
        </div>
    </div>
{% endblock %}
