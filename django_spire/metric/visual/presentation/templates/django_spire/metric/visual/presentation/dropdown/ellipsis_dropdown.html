{% extends 'django_spire/dropdown/ellipsis_dropdown.html' %}

{% block dropdown_content %}
    <li>
        <a class="dropdown-item d-flex align-items-center gap-2"
           :href="`{% url 'django_spire:metric:visual:presentation:page:detail' pk=0 %}`.replace('0', item.id)">
            <i class="bi bi-eye"></i>View
        </a>
    </li>
    <li>
        <a class="dropdown-item d-flex align-items-center gap-2"
           :href="`{% url 'django_spire:metric:visual:presentation:form:update' pk=0 %}`.replace('0', item.id)">
            <i class="bi bi-pencil"></i>Edit
        </a>
    </li>
    <li>
        <a class="dropdown-item d-flex align-items-center gap-2 text-danger"
           :href="`{% url 'django_spire:metric:visual:presentation:form:delete' pk=0 %}`.replace('0', item.id)">
            <i class="bi bi-trash"></i>Delete
        </a>
    </li>
{% endblock %}
