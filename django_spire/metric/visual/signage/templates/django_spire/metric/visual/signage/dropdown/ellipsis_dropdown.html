{% extends 'django_spire/dropdown/ellipsis_dropdown.html' %}

{% block dropdown_content %}
    <li>
        <a class="dropdown-item d-flex align-items-center gap-2"
           :href="`{% url 'django_spire:metric:visual:signage:page:detail' pk=0 %}`.replace('0', item.id)">
            <i class="bi bi-eye"></i>View
        </a>
    </li>
    <li>
        <a class="dropdown-item d-flex align-items-center gap-2"
           :href="`{% url 'django_spire:metric:visual:signage:page:display' key='00000000-0000-0000-0000-000000000000' %}`.replace('00000000-0000-0000-0000-000000000000', item.key)">
            <i class="bi bi-play-circle"></i>Display
        </a>
    </li>
    <li>
        <a class="dropdown-item d-flex align-items-center gap-2"
           :href="`{% url 'django_spire:metric:visual:signage:form:update' pk=0 %}`.replace('0', item.id)">
            <i class="bi bi-pencil"></i>Edit
        </a>
    </li>
    <li>
        <a class="dropdown-item d-flex align-items-center gap-2 text-danger"
           :href="`{% url 'django_spire:metric:visual:signage:form:delete' pk=0 %}`.replace('0', item.id)">
            <i class="bi bi-trash"></i>Delete
        </a>
    </li>
{% endblock %}
