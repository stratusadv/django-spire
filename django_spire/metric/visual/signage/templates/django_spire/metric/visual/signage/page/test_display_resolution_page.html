{% extends "django_spire/base/base.html" %}

{% block base_body_content %}
    <div class="p-4">
        <h1 class="mb-4">Testing "{{ signage.name }}" at {{ request.GET.width }} x {{ request.GET.height }} </h1>

        <h3>No Scale</h3>
        <iframe class="border border-2 border-dark mb-3" src="{% url 'django_spire:metric:visual:signage:page:display' key=signage.key %}"
                width="{{ request.GET.width }}" height="{{ request.GET.height }}"></iframe>

        <h3>Medium Scale</h3>
        <iframe class="border border-2 border-dark mb-3" src="{% url 'django_spire:metric:visual:signage:page:display' key=signage.key %}?scale=medium"
                width="{{ request.GET.width }}" height="{{ request.GET.height }}"></iframe>

        <h3>High Scale</h3>
        <iframe class="border border-2 border-dark mb-3" src="{% url 'django_spire:metric:visual:signage:page:display' key=signage.key %}?scale=high"
                width="{{ request.GET.width }}" height="{{ request.GET.height }}"></iframe>
    </div>
{% endblock %}
